[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-cost-based-query-optimizer-skill"
version = "1.0.0"
description = "Cost-based relational query optimizer (CBO) evaluating nested loop, hash join, and sort-merge joins."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-cost-based-query-optimizer-skill"
Repository = "https://github.com/alphaparkinc/genpark-cost-based-query-optimizer-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-cost-based-query-optimizer-skill/issues"
